name: Build and test

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  build:
    name: windows-latest
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # for minver
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Execute build and run tests
      run: |
        dotnet build --configuration Release /nologo
        dotnet test --project tests/Toolkit.AssemblyResolver.Tests/Toolkit.AssemblyResolver.Tests.csproj --configuration Release
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VolocyNazad.AssemblyResolver
        path: artifacts/*
